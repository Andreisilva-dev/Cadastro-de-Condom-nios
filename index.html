<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem de Condominio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Sistema de Condominio</h1>
    <div class="container">

        <div class="caixaCadastro">
            <h1>Cadastro de Condomínio</h1>
            <div class="form">
                <label>Nome Do Condominio</label>
                <input type="text" class="nomeDoCondomio">
                <Label>Endereço</Label>
                <input type="text" class="endereco">
                
                <label>Observação</label>
                <textarea name="obs" class="obs" rows="5" cols="33">
                </textarea>
                <div class="buttons">
                    <button class="btnCadastrar">Cadastrar</button>
                    <button class="btnLimparCadastra">Limpar</button>
                </div>
            </div>
        </div>

        <div class="caixaConsultado">
            <h1>Consulta</h1>
            <label for="">nome do Condominio</label>
            <input type="text" placeholder="digite o nome condomio" class="inputconsulta">
            <div class="butttons">
                <button class="btnConsultar">consultar</button>
                <button class="btnLimparConsulta">Limpar</button>
            </div>
            <div class="pdfConsulta">
                <p class="resuldadoConsulta"></p>
            </div>
        </div>

        <div class="buscaAtualizar">
            <label for="">busca condominio</label>
            <input type="text"  class="inputCondominioAtualizar">
            <button class="btnBucarAtualizar">Buscar Atualização</button>
        </div>
    </div>

    <div class="modal_atualizar">
        <h1>modal de atualização</h1>
        <label>Nome</label>
        <input type="text" class="atulizaNome">
        <label>Endereço</label>
        <input type="text" class="atulizaEndereco">
        <label>Observação</label>
        <textarea name="" class="atulizaoObs" rows="5" cols="33"></textarea>
        <div class="buttons">
            <button class="btnAtulizar">Atualizar</button>
            <button class="btnFechar">fechar</button>
        </div>
    </div>

    <div class="modal_deletar_dados">
        <h1>deletar condominio</h1>
        <label>Qual condominio quer deletar</label>
        <input type="text" class="deleta_condominio">
        <button class="btnDeletar">Deletar</button>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
